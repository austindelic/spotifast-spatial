# Native per-app audio controls need a real bundle, including in development.
[target.'cfg(target_os = "macos")']
runner = ["sh", "packaging/macos/run-dev.sh"]

[target.x86_64-pc-windows-msvc]
# Windows downloads are standalone, including the MSVC runtime.
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
