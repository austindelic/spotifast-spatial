[package]
name = "spatial-audio-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Keep feasibility dependencies and their lockfile out of production playback.
[workspace]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSDate", "NSError", "NSProcessInfo", "NSRunLoop", "NSString"] }
# Public Apple audio and owned PCM sample buffers for the feasibility probe.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVSampleBufferAudioRenderer", "AVSampleBufferRenderSynchronizer", "AVQueuedSampleBufferRendering", "AVAudioProcessingSettings", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase"] }
